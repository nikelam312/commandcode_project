[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jd-stock-monitor"
version = "0.1.0"
description = "Conservative JD Hong Kong product availability monitor"
requires-python = ">=3.11"
dependencies = ["playwright>=1.52"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
